spring.application.name=ebank-service
server.port=8082
# In-memory database (reset on every restart)
spring.datasource.url=jdbc:h2:mem:accounts-db
spring.h2.console.enabled=true

# Registration in the Discovery Service (Eureka); also used by OpenFeign to find customer-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Wrap every Feign call in a Resilience4j circuit breaker (fallbacks are declared on the @FeignClient)
spring.cloud.openfeign.circuitbreaker.enabled=true
# Open the circuit when at least 50% of the last 10 calls failed (counted after 5 calls),
# stay open 10s, then let 3 trial calls through (half-open) to decide whether to close it again
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
# A customer that does not exist is a normal answer, not a sign that customer-service is down
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$NotFound
resilience4j.timelimiter.configs.default.timeout-duration=3s

# /actuator/circuitbreakers shows each circuit breaker state (CLOSED, OPEN, HALF_OPEN)
management.endpoints.web.exposure.include=health,info,circuitbreakers
