spring.application.name=ebank-chatbot-service
server.port=8083

# Registration in the Discovery Service (Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# LLM: the key is read from the OPENAI_API_KEY environment variable, never written here.
# It can also be put in a file outside the Git repository, as a line OPENAI_API_KEY=sk-...
spring.config.import=optional:file:${user.home}/.ebank/secrets.properties
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5-mini}

# MCP client: the agent discovers and calls the tools of both MCP servers (Streamable HTTP)
spring.ai.mcp.client.name=ebank-chatbot
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.streamable-http.connections.customer-service.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.customer-service.endpoint=/mcp
spring.ai.mcp.client.streamable-http.connections.ebank-service.url=http://localhost:8082
spring.ai.mcp.client.streamable-http.connections.ebank-service.endpoint=/mcp

management.endpoints.web.exposure.include=health,info
