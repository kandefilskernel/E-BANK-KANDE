# Databases of the E-BANK microservices: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: ebank-postgres
    environment:
      POSTGRES_USER: ebank
      POSTGRES_PASSWORD: ebank
      POSTGRES_DB: customers_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Run once, on the first start: creates the second database (one database per microservice)
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebank -d customers_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: ebank-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ebank.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
