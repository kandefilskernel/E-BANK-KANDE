spring.application.name=customer-service
server.port=8081

# PostgreSQL database (started with docker compose, see docker-compose.yml); env variables override the defaults
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customers_db}
spring.datasource.username=${DB_USER:ebank}
spring.datasource.password=${DB_PASSWORD:ebank}
spring.jpa.hibernate.ddl-auto=update

# Registration in the Discovery Service (Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

# MCP server: tools annotated with @McpTool are exposed at http://localhost:8081/mcp (Streamable HTTP)
spring.ai.mcp.server.name=customer-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=streamable
