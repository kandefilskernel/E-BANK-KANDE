spring.application.name=gateway-service
server.port=8888

# Registration in the Discovery Service (Eureka); lb:// URIs below are resolved from it
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Static routes: requests are forwarded to a service instance found in Eureka (lb = load balanced)
spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://customer-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/customers/**

spring.cloud.gateway.server.webmvc.routes[1].id=ebank-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ebank-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/accounts/**

management.endpoints.web.exposure.include=health,info,gateway
